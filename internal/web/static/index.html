<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>maia</title>
  <meta name="description" content="Local web UI for the maia AI code change workflow">
  <meta name="theme-color" content="#0f1117">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="shell">
    <aside id="sidebar" aria-label="Navigation"></aside>
    <div id="col">
      <header id="mobilebar" aria-label="Navigation">
        <button id="navtoggle" class="icon-btn" type="button" aria-label="Open menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button id="backbtn" class="icon-btn hidden" type="button" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
      </header>
      <div id="banner" class="banner hidden"></div>
      <main id="view"></main>
    </div>
  </div>
  <div id="drawer-overlay" class="hidden" aria-hidden="true"></div>
  <aside id="drawer" class="hidden" aria-label="Navigation"></aside>
  <div id="palette-root"></div>
  <noscript>
    <p style="padding:2rem">maia's web UI requires JavaScript.</p>
  </noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
